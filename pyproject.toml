[project]
name = "aimac"
version = "0.1.0"
description = "AI Model Accessibility Checker - CLI tools for benchmarking LLM accessibility"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Joe Devon, Eamon McErlean" }
]
keywords = ["ai", "accessibility", "a11y", "llm", "benchmarking", "wcag", "axe-core", "openrouter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "python-dotenv>=1.0.0",
    "playwright>=1.48.0",
    "httpx[http2]>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://aimac.ai"
Repository = "https://github.com/GAAD-Foundation/AIMAC"
Documentation = "https://github.com/GAAD-Foundation/AIMAC#readme"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
aimac = "aimac.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aimac*"]

# Code quality tools
[tool.black]
line-length = 160
target-version = ["py312"]


[tool.ruff]
target-version = "py312"
line-length = 160
exclude = [
    ".venv",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
force-single-line = false
split-on-trailing-comma = false
force-sort-within-sections = true


[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["output", ".git", ".venv", "build", "dist", "__pycache__", "*.egg-info"]
markers = [
    "slow: marks tests as slow (browser automation, integration tests)",
    "integration: marks tests that require full environment setup",
]
